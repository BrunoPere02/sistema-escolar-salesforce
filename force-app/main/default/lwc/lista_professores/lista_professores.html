<template>
    <lightning-card title="Lista de Professores" icon-name="standard:education">
        <div class="slds-m-around_medium">
            <template if:true={professores}>
                <lightning-datatable
                    key-field="Id"
                    data={professores}
                    columns={columns}>
                </lightning-datatable>
            </template>
            <template if:true={erro}>
                <p>Erro ao carregar professores.</p>
            </template>
        </div>
    </lightning-card>
</template>
