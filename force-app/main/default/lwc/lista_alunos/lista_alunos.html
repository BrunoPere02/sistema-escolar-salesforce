<template>
    <lightning-card title="Lista de Alunos" icon-name="standard:contact">
        <div class="slds-m-around_medium">
            <lightning-combobox
                label="Filtrar por Status"
                value={statusSelecionado}
                options={opcoesStatus}
                onchange={handleFiltro}>
            </lightning-combobox>
            <br/>
            <template if:true={alunosFiltrados}>
                <lightning-datatable
                    key-field="Id"
                    data={alunosFiltrados}
                    columns={columns}>
                </lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
