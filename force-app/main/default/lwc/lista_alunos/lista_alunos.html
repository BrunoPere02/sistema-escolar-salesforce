<template>
    <lightning-card title="Lista de Alunos" icon-name="standard:contact">
        <div class="slds-m-around_medium">
            <template if:true={alunos}>
                <lightning-datatable
                    key-field="Id"
                    data={alunos}
                    columns={columns}>
                </lightning-datatable>
            </template>
            <template if:true={erro}>
                <p>Erro ao carregar alunos.</p>
            </template>
        </div>
    </lightning-card>
</template>
